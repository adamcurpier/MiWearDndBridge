name: Generate Word Technical Report

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "TECHNICAL_REPORT.md"
      - ".github/workflows/generate-docx.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate Word report from final Markdown report
        run: |
          mkdir -p docs
          pandoc TECHNICAL_REPORT.md \
            --from=gfm \
            --to=docx \
            --metadata title="MiWear DND Bridge - Version 1.0 Final Report" \
            -o docs/MiWear-DND-Bridge-v1.0.0-Final-Report.docx

      - name: Commit generated Word report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MiWear-DND-Bridge-v1.0.0-Final-Report.docx
          if git diff --cached --quiet; then
            echo "Word report is already current."
          else
            git commit -m "Generate v1.0 Word technical report"
            git push
          fi
